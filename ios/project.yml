name: MarketWidgets
options:
  bundleIdPrefix: com.lucas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  MarketWidgets:
    type: application
    platform: iOS
    sources:
      - MarketWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.marketwidgets
        INFOPLIST_KEY_CFBundleDisplayName: Market Widgets
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: MarketWidgetsWidgets

  MarketWidgetsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MarketWidgetsWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.marketwidgets.widgets
        INFOPLIST_FILE: MarketWidgetsWidgets/Info.plist
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
